<footer class="portfolio-footer">
  <div class="footer-container">
    
    <div class="footer-brand">
      <h3>Lic. en <span>Comunicación</span></h3>
      <p>Soy un profesional con más de 30 años de experiencia en el ámbito de comunicación social y periodismo.</p>
    </div>

    <div class="footer-nav">
      <h4>Navegación</h4>
      <ul>
        <li *ngFor="let link of navLinks">
          <a [href]="link.fragment">{{ link.label }}</a>
        </li>
      </ul>
    </div>

    <div class="footer-social">
      <h4>Conectemos</h4>
      <div class="social-icons">
        <a *ngFor="let social of socialLinks" 
           [href]="social.url" 
           target="_blank" 
           rel="noopener noreferrer"
           [title]="social.name"
           class="social-btn">
          
          <svg *ngIf="social.icon === 'instagram'" class="social-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
          </svg>

          <svg *ngIf="social.icon === 'facebook'" class="social-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>

          <span class="social-text">{{ social.name }}</span>
        </a>
      </div>
    </div>

  </div>

  <div class="footer-bottom">
    <p>&copy; {{ currentYear }} — Creado por Ing. Karina Cabrera</p>
  </div>
</footer>
